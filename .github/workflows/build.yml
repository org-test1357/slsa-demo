name: Code to Cloud Visibility POC

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/app
  IMAGE_REF: ghcr.io/${{ github.repository }}/app

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ env.IMAGE_REF }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REF }}:latest
            ${{ env.IMAGE_REF }}:${{ github.sha }}

      - name: Generate SLSA provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_REF }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Optional: only keep this if you want an explicit/manual storage record
      # instead of relying on automatic storage-record creation.
      - name: Create storage record (optional manual fallback)
        env:
          ORG: ${{ github.repository_owner }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/orgs/${ORG}/artifacts/metadata/storage-record \
            -d @- <<EOF
          {
            "name": "${IMAGE_REF}",
            "digest": "${DIGEST}",
            "version": "${GITHUB_SHA}",
            "artifact_url": "https://${IMAGE_REF}@${DIGEST}",
            "registry_url": "https://ghcr.io",
            "repository": "${{ github.repository }}/app",
            "status": "active",
            "return_records": true
          }
          EOF

  record-deployment:
    runs-on: ubuntu-latest
    needs: build-and-attest

    steps:
      - name: Create deployment record
        env:
          ORG: ${{ github.repository_owner }}
          IMAGE_REF: ${{ needs.build-and-attest.outputs.image_ref }}
          DIGEST: ${{ needs.build-and-attest.outputs.digest }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/orgs/${ORG}/artifacts/metadata/deployment-record \
            -d @- <<EOF
          {
            "name": "${IMAGE_REF}",
            "digest": "${DIGEST}",
            "version": "${GITHUB_SHA}",
            "status": "deployed",
            "logical_environment": "dev",
            "physical_environment": "south-india",
            "cluster": "aks-dev-01",
            "deployment_name": "default-app-app",
            "runtime_risks": ["internet-exposed"],
            "tags": {
              "namespace": "default",
              "workload": "deployment/app",
              "commit": "${GITHUB_SHA}"
            },
            "return_records": true
          }
          EOF

      - name: Verify storage records
        env:
          ORG: ${{ github.repository_owner }}
          DIGEST: ${{ needs.build-and-attest.outputs.digest }}
        run: |
          curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/orgs/${ORG}/artifacts/${DIGEST}/metadata/storage-records

      - name: Verify deployment records
        env:
          ORG: ${{ github.repository_owner }}
          DIGEST: ${{ needs.build-and-attest.outputs.digest }}
        run: |
          curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/orgs/${ORG}/artifacts/${DIGEST}/metadata/deployment-records
